name: Remote Custom Image Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия OpenWrt'
        required: true
      target:
        description: 'Архитектура'
        required: true
      subtarget:
        description: 'Чипсет'
        required: true
      profile:
        description: 'Профиль роутера'
        required: true
      packages:
        description: 'Пакеты через пробел'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip libncurses5-dev zlib1g-dev libssl-dev file wget rsync jq zstd curl python3 xz-utils

      - name: Download and Extract OpenWrt Image Builder
        shell: python
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_SUBTARGET: ${{ github.event.inputs.subtarget }}
        run: |
          import urllib.request, subprocess, os, sys
          v = os.environ.get("INPUT_VERSION", "").strip()
          t = os.environ.get("INPUT_TARGET", "").strip()
          s = os.environ.get("INPUT_SUBTARGET", "").strip()
          is_snapshot = v.lower() == "snapshot"
          if is_snapshot:
              base_url = f"https://downloads.openwrt.org/snapshots/targets/{t}/{s}"
          else:
              base_url = f"https://downloads.openwrt.org/releases/{v}/targets/{t}/{s}"
          print(f"[Инфо] Сканируем: {base_url}")
          try:
              sha256_url = f"{base_url}/sha256sums"
              req = urllib.request.Request(sha256_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  lines = response.read().decode('utf-8').splitlines()
          except Exception as e:
              print(f"Ошибка: {e}", file=sys.stderr); sys.exit(1)
          ib_filename = None
          for line in lines:
              if "imagebuilder" in line and "Linux-x86_64" in line:
                  ib_filename = line.split()[-1].lstrip('*'); break
          if not ib_filename:
              print("Image Builder не найден!", file=sys.stderr); sys.exit(1)
          print(f"[Успех] {ib_filename}")
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent', 'Mozilla/5.0')]
          urllib.request.install_opener(opener)
          urllib.request.urlretrieve(f"{base_url}/{ib_filename}", "imagebuilder.archive")
          os.makedirs("openwrt-ib", exist_ok=True)
          subprocess.run(["tar", "-xf", "imagebuilder.archive", "-C", "openwrt-ib", "--strip-components=1"], check=True)

      - name: Resolve Real Profile Name via Make Info
        id: resolve_profile
        working-directory: openwrt-ib
        shell: python
        env:
          LAUNCHER_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          import subprocess, os, re, difflib
          requested = os.environ.get("LAUNCHER_PROFILE", "").strip()
          result = subprocess.run(["make", "info"], capture_output=True, text=True)
          available_profiles = []
          profile_pattern = re.compile(r'^([a-zA-Z0-9_\-]+):')
          for line in result.stdout.splitlines():
              match = profile_pattern.match(line.strip())
              if match:
                  prof = match.group(1)
                  if prof.lower() not in ["target", "profile", "current", "available", "packages"]:
                      available_profiles.append(prof)
          best_match = None
          if requested in available_profiles:
              best_match = requested
          else:
              matches = difflib.get_close_matches(requested, available_profiles, n=1, cutoff=0.3)
              if matches:
                  best_match = matches[0]
              else:
                  def clean(s): return s.lower().replace("-","").replace("_","").replace(" ","")
                  for p in available_profiles:
                      if clean(requested) in clean(p) or clean(p) in clean(requested):
                          best_match = p; break
          if not best_match:
              best_match = requested
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"REAL_PROFILE={best_match}\n")

      - name: Inject Custom Packages Feed
        working-directory: openwrt-ib
        env:
          VER: ${{ github.event.inputs.version }}
          TGT: ${{ github.event.inputs.target }}
          SUB: ${{ github.event.inputs.subtarget }}
        run: |
          set -e

          if [[ "$VER" == 23.05* ]]; then
            FEED_BRANCH="23.05"; INDEX_FILE="Packages.gz"; IS_APK=0
          elif [[ "$VER" == 24.10* ]]; then
            FEED_BRANCH="24.10"; INDEX_FILE="Packages.gz"; IS_APK=0
          elif [[ "$VER" == 25.12* ]] || [[ "$VER" == "snapshot" ]]; then
            FEED_BRANCH="25.12"; INDEX_FILE="APKINDEX.tar.gz"; IS_APK=1
          else
            FEED_BRANCH="24.10"; INDEX_FILE="Packages.gz"; IS_APK=0
          fi
          echo "[Инфо] Версия: $VER → ветка: $FEED_BRANCH, apk=$IS_APK"

          case "${TGT}/${SUB}" in
            "mediatek/filogic"|"mediatek/mt7622"|\
            "qualcommax/ipq807x"|"qualcommax/ipq60xx"|"qualcommax/ipq50xx"|\
            "bcm27xx/bcm2710"|"bcm27xx/bcm2711"|"bcm27xx/bcm2712"|\
            "rockchip/armv8"|"sunxi/cortexa53"|"mvebu/cortexa53")
              ARCH_DIR="aarch64_cortex-a53" ;;
            "ramips/mt7621"|"ramips/mt7620"|"ramips/mt76x8"|\
            "ramips/rt305x"|"ramips/rt3883")
              ARCH_DIR="mipsel_24kc" ;;
            "ath79/generic"|"ath79/tiny"|"ath79/nand"|"ath79/mikrotik"|\
            "lantiq/xrx200"|"lantiq/xrx200_legacy"|"lantiq/xway")
              ARCH_DIR="mips_24kc" ;;
            *)
              ARCH_DIR="aarch64_cortex-a53" ;;
          esac
          echo "[Инфо] arch: $ARCH_DIR"

          FEED_URL="https://raw.githubusercontent.com/vladmir1981/custom-packages-repo/main/${FEED_BRANCH}/${ARCH_DIR}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${FEED_URL}/${INDEX_FILE}" || echo "000")
          echo "[Инфо] HTTP фида: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠ Фид недоступен"
            exit 0
          fi

          if [ "$IS_APK" = "1" ]; then
            # Локальная установка .apk в папку packages/
            mkdir -p packages
            BASE_APK="https://github.com/1andrevich/zapret2-openwrt/releases/download/v1.0.5.2"
            ZAPRET2_FILE="zapret2_${ARCH_DIR}.apk"
            LUCI_FILE="luci-app-zapret2.apk"

            echo "[Инфо] Скачиваем ${ZAPRET2_FILE}"
            curl -sL "${BASE_APK}/${ZAPRET2_FILE}" -o "packages/${ZAPRET2_FILE}"
            echo "[Инфо] Скачиваем ${LUCI_FILE}"
            curl -sL "${BASE_APK}/${LUCI_FILE}" -o "packages/${LUCI_FILE}"

            echo "[Инфо] Размеры:"
            ls -la packages/

            # Ключ
            sudo mkdir -p /etc/apk/keys
            sudo curl -sL "https://raw.githubusercontent.com/vladmir1981/custom-packages-repo/main/zapret2-1andrevich.pub" -o /etc/apk/keys/zapret2-1andrevich.pub
            sudo chmod 644 /etc/apk/keys/zapret2-1andrevich.pub
            cp /etc/apk/keys/zapret2-1andrevich.pub keys/ 2>/dev/null || true
          else
            echo "src custom ${FEED_URL}" >> repositories.conf
            grep -v "check_signature" repositories.conf > /tmp/repos.tmp || true
            mv /tmp/repos.tmp repositories.conf
            echo "=== repositories.conf ==="
            cat repositories.conf
          fi

      - name: Run Firmware Compilation
        working-directory: openwrt-ib
        run: |
          make image \
            PROFILE="${{ steps.resolve_profile.outputs.REAL_PROFILE }}" \
            PACKAGES="${{ github.event.inputs.packages }}"

      - name: Upload Finished Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.resolve_profile.outputs.REAL_PROFILE }}-${{ github.event.inputs.version }}
          path: |
            openwrt-ib/bin/targets/*/*/*
            !openwrt-ib/bin/targets/*/*/packages
          if-no-files-found: error
