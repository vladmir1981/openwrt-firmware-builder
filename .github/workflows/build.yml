      - name: Resolve Real Profile Name via Make Info
        id: resolve_profile
        working-directory: openwrt-ib
        shell: python
        env:
          LAUNCHER_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          import subprocess
          import os
          import sys
          import re

          requested = os.environ.get("LAUNCHER_PROFILE", "").strip().lower()
          requested_clean = requested.replace("_", "").replace("-", "")
          print(f"[Поиск] Ищем лучший профиль для переданного имени: {os.environ.get('LAUNCHER_PROFILE')}")

          # Запрашиваем официальный список профилей у конструктора
          result = subprocess.run(["make", "info"], capture_output=True, text=True)
          
          available_profiles = []
          
          # Регулярное выражение ищет строки, которые начинаются со слова (без пробелов) и заканчиваются двоеточием.
          # Это гарантированно отсекает строки типа "Current Target: ..." или "Default Packages: ..."
          profile_pattern = re.compile(r'^([a-zA-Z0-9_\-]+):$')

          lines = result.stdout.splitlines()
          for line in lines:
              match = profile_pattern.match(line.strip())
              if match:
                  prof_name = match.group(1)
                  # Исключаем системные заголовки, если они совпали с паттерном
                  if prof_name.lower() not in ["target", "profile", "current", "available"]:
                      if prof_name not in available_profiles:
                          available_profiles.append(prof_name)

          print(f"[Инфо] Успешно найденные профили в Image Builder: {available_profiles}")

          if not available_profiles:
              print("Критическая ошибка: Список доступных профилей пуст! Проверьте вывод команды make info.", file=sys.stderr)
              sys.exit(1)

          best_match = None

          # Шаг 1: Проверяем строгое совпадение без учета дефисов и подчеркиваний
          for p in available_profiles:
              if requested_clean == p.lower().replace("_", "").replace("-", ""):
                  best_match = p
                  break

          # Шаг 2: Ищем частичное совпадение
          if not best_match:
              for p in available_profiles:
                  p_clean = p.lower().replace("_", "").replace("-", "")
                  if requested_clean in p_clean or p_clean in requested_clean:
                      best_match = p
                      break

          # Шаг 3: Ищем по отдельным ключевым словам модели
          if not best_match:
              parts = [part for part in re.split(r'[-_]', requested) if len(part) > 2]
              for part in parts:
                  for p in available_profiles:
                      if part in p.lower():
                          best_match = p
                          break
                  if best_match:
                      break

          # Fallback защита
          if not best_match:
              best_match = os.environ.get("LAUNCHER_PROFILE")
              print(f"[Предупреждение] Точного совпадения не найдено. Используем базовый профиль: {best_match}")
          else:
              print(f"🎉 [УСПЕХ] Облако автоматически сопоставило профиль: {best_match}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"REAL_PROFILE={best_match}\n")
