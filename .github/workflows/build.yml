      - name: Resolve Real Profile Name via Make Info
        id: resolve_profile
        working-directory: openwrt-ib
        shell: python
        env:
          LAUNCHER_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          import subprocess
          import os
          import sys
          import re

          requested = os.environ.get("LAUNCHER_PROFILE", "").strip().lower()
          requested_clean = requested.replace("_", "").replace("-", "")
          print(f"[Поиск] Ищем лучший профиль для переданного имени: {os.environ.get('LAUNCHER_PROFILE')}")

          # Запрашиваем официальный список профилей у конструктора
          result = subprocess.run(["make", "info"], capture_output=True, text=True)
          
          available_profiles = []
          
          # Шаг 1: Собираем ТОЛЬКО технические имена профилей
          lines = result.stdout.splitlines()
          for line in lines:
              if line.startswith("Profile:"):
                  prof = line.replace("Profile:", "").strip()
                  if prof and prof not in available_profiles:
                      available_profiles.append(prof)

          print(f"[Инфо] Доступные технические профили в Image Builder: {available_profiles}")

          best_match = None

          # Шаг 2: Проверяем строгое совпадение без учета дефисов и подчеркиваний
          for p in available_profiles:
              p_clean = p.lower().replace("_", "").replace("-", "")
              if requested_clean == p_clean:
                  best_match = p
                  break

          # Шаг 3: Если точного совпадения нет, ищем частичное вхождение
          if not best_match:
              for p in available_profiles:
                  p_clean = p.lower().replace("_", "").replace("-", "")
                  if requested_clean in p_clean or p_clean in requested_clean:
                      best_match = p
                      break

          # Шаг 4: ИСПРАВЛЕНО (Убран значок !). Ищем по отдельным словам, разбивая по дефисам и подчеркиваниям
          if not best_match:
              parts = [part for part in re.split(r'[-_]', requested) if len(part) > 2]
              for part in parts:
                  for p in available_profiles:
                      if part in p.lower():
                          best_match = p
                          break
                  if best_match:
                      break

          # Fallback защита
          if not best_match:
              best_match = os.environ.get("LAUNCHER_PROFILE")
              print(f"[Предупреждение] Сопоставить не удалось. Используем базовый: {best_match}")
          else:
              print(f"🎉 [УСПЕХ] Облако автоматически сопоставило профиль: {best_match}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"REAL_PROFILE={best_match}\n")
