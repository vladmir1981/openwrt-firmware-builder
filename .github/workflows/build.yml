name: Remote Custom Image Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия OpenWrt (например: 25.12.5 или snapshot)'
        required: true
      target:
        description: 'Архитектура (например: mediatek)'
        required: true
      subtarget:
        description: 'Чипсет (например: filogic)'
        required: true
      profile:
        description: 'Профиль роутера'
        required: true
      packages:
        description: 'Пакеты через пробел'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip libncurses5-dev zlib1g-dev libssl-dev file wget rsync jq zstd curl python3

      - name: Download and Extract OpenWrt Image Builder
        shell: python
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_SUBTARGET: ${{ github.event.inputs.subtarget }}
        run: |
          import urllib.request
          import subprocess
          import os
          import sys

          v = os.environ.get("INPUT_VERSION", "").strip()
          t = os.environ.get("INPUT_TARGET", "").strip()
          s = os.environ.get("INPUT_SUBTARGET", "").strip()

          is_snapshot = v.upper() == "SNAPSHOT"
          
          if is_snapshot:
              base_url = f"https://downloads.openwrt.org/snapshots/targets/{t}/{s}"
          else:
              base_url = f"https://downloads.openwrt.org/releases/{v}/targets/{t}/{s}"

          print(f"[Инфо] Сканируем директорию: {base_url}")
          try:
              sha256_url = f"{base_url}/sha256sums"
              req = urllib.request.Request(sha256_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  lines = response.read().decode('utf-8').splitlines()
          except Exception as e:
              print(f"Ошибка получения индекса: {e}", file=sys.stderr)
              sys.exit(1)

          ib_filename = None
          for line in lines:
              if "imagebuilder" in line and "Linux-x86_64" in line:
                  ib_filename = line.split()[-1].lstrip('*')
                  break

          if not ib_filename:
              print("Критическая ошибка: Image Builder не найден в манифесте релиза!", file=sys.stderr)
              sys.exit(1)

          print(f"[Успех] Скачиваем: {ib_filename}")
          
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent', 'Mozilla/5.0')]
          urllib.request.install_opener(opener)
          
          urllib.request.urlretrieve(f"{base_url}/{ib_filename}", "imagebuilder.archive")
          os.makedirs("openwrt-ib", exist_ok=True)
          subprocess.run(["tar", "-xf", "imagebuilder.archive", "-C", "openwrt-ib", "--strip-components=1"], check=True)

      - name: Resolve Real Profile Name via Make Info
        id: resolve_profile
        working-directory: openwrt-ib
        shell: python
        env:
          LAUNCHER_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          import subprocess, os, re
          
          requested = os.environ.get("LAUNCHER_PROFILE", "").strip().lower().replace("_", "").replace("-", "")
          result = subprocess.run(["make", "info"], capture_output=True, text=True)
          
          available_profiles = []
          profile_pattern = re.compile(r'^([a-zA-Z0-9_\-]+):')
          
          for line in result.stdout.splitlines():
              match = profile_pattern.match(line.strip())
              if match:
                  prof = match.group(1)
                  if prof.lower() not in ["target", "profile", "current", "available", "packages"]:
                      available_profiles.append(prof)
          
          best_match = None
          for p in available_profiles:
              clean_p = p.lower().replace("_","").replace("-","")
              if requested in clean_p or clean_p in requested:
                  best_match = p
                  break
                  
          if not best_match: 
              best_match = os.environ.get("LAUNCHER_PROFILE").strip()
              print(f"⚠️ [Предупреждение] Совпадений не найдено. Используем исходный профиль: {best_match}")
          else:
              print(f"🎉 [УСПЕХ] Автоматически сопоставлен рабочий профиль: {best_match}")
              
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: 
              f.write(f"REAL_PROFILE={best_match}\n")

      - name: Run Firmware Compilation
        working-directory: openwrt-ib
        run: |
          make image \
            PROFILE="${{ steps.resolve_profile.outputs.REAL_PROFILE }}" \
            PACKAGES="${{ github.event.inputs.packages }}"

      - name: Upload Finished Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.resolve_profile.outputs.REAL_PROFILE }}-${{ github.event.inputs.version }}
          path: |
            openwrt-ib/bin/targets/*/*/*
            !openwrt-ib/bin/targets/*/*/packages
          if-no-files-found: error
