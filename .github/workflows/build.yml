name: Remote Custom Image Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия OpenWrt (например: 23.05.5 или snapshot)'
        required: true
      target:
        description: 'Архитектура (например: ramips)'
        required: true
      subtarget:
        description: 'Чипсет (например: mt7621)'
        required: true
      profile:
        description: 'Профиль роутера (например: mercusys-mr70x-v1)'
        required: true
      packages:
        description: 'Пакеты через пробел'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip libncurses5-dev zlib1g-dev libssl-dev file wget rsync jq zstd curl python3

      - name: Download and Extract OpenWrt Image Builder
        shell: python
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_SUBTARGET: ${{ github.event.inputs.subtarget }}
        run: |
          import urllib.request
          import subprocess
          import os
          import sys

          v = os.environ.get("INPUT_VERSION", "").strip()
          t = os.environ.get("INPUT_TARGET", "").strip()
          s = os.environ.get("INPUT_SUBTARGET", "").strip()

          is_snapshot = v.upper() == "SNAPSHOT"
          
          if is_snapshot:
              base_url = f"https://downloads.openwrt.org/snapshots/targets/{t}/{s}"
          else:
              base_url = f"https://downloads.openwrt.org/releases/{v}/targets/{t}/{s}"

          print(f"[Инфо] Сканируем директорию: {base_url}")
          
          try:
              sha256_url = f"{base_url}/sha256sums"
              with urllib.request.urlopen(sha256_url) as response:
                  lines = response.read().decode('utf-8').splitlines()
          except Exception as e:
              print(f"Критическая ошибка: Не удалось получить индекс файлов по адресу {sha256_url}. Ошибка: {e}", file=sys.stderr)
              sys.exit(1)

          ib_filename = None
          for line in lines:
              if "imagebuilder" in line and "Linux-x86_64" in line:
                  ib_filename = line.split()[-1].lstrip('*')
                  break

          if not ib_filename:
              print("Критическая ошибка: Файл Image Builder не найден в манифесте!", file=sys.stderr)
              sys.exit(1)

          download_url = f"{base_url}/{ib_filename}"
          print(f"[Успех] Найдено точное имя файла: {ib_filename}")
          
          urllib.request.urlretrieve(download_url, "imagebuilder.archive")
          
          print("[Распаковка] Извлечение структуры Image Builder...")
          os.makedirs("openwrt-ib", exist_ok=True)
          subprocess.run(["tar", "-xf", "imagebuilder.archive", "-C", "openwrt-ib", "--strip-components=1"], check=True)

      - name: Inject Custom Repository
        working-directory: openwrt-ib
        run: |
          echo "src/gz custom_repo https://vladmir1981.github.io/custom-packages-repo/" >> repositories.conf

      - name: Resolve Real Profile Name via Make Info
        id: resolve_profile
        working-directory: openwrt-ib
        shell: python
        env:
          LAUNCHER_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          import subprocess
          import os
          import sys
          import re

          requested = os.environ.get("LAUNCHER_PROFILE", "").strip().lower()
          requested_clean = requested.replace("_", "").replace("-", "")
          print(f"[Поиск] Ищем лучший профиль для переданного имени: {os.environ.get('LAUNCHER_PROFILE')}")

          result = subprocess.run(["make", "info"], capture_output=True, text=True)
          
          available_profiles = []
          profile_pattern = re.compile(r'^\s*([a-zA-Z0-9_\-]+):')

          system_garbage = [
              "target", "profile", "current", "available", "packages", 
              "hasimagemetadata", "supporteddevices", "enabled"
          ]

          lines = result.stdout.splitlines()
          for line in lines:
              match = profile_pattern.match(line)
              if match:
                  prof_name = match.group(1)
                  if prof_name.lower() not in system_garbage:
                      if prof_name not in available_profiles:
                          available_profiles.append(prof_name)

          print(f"[Инфо] Успешно найденные профили в Image Builder: {available_profiles}")

          if not available_profiles:
              print("Критическая ошибка: Список доступных профилей пуст! Проверьте вывод команды make info.", file=sys.stderr)
              sys.exit(1)

          best_match = None

          for p in available_profiles:
              if requested_clean == p.lower().replace("_", "").replace("-", ""):
                  best_match = p
                  break

          if not best_match:
              for p in available_profiles:
                  p_clean = p.lower().replace("_", "").replace("-", "")
                  if requested_clean in p_clean or p_clean in requested_clean:
                      best_match = p
                      break

          if not best_match:
              parts = [part for part in re.split(r'[-_]', requested) if len(part) > 2]
              for part in parts:
                  for p in available_profiles:
                      if part in p.lower():
                          best_match = p
                          break
                  if best_match:
                      break

          if not best_match:
              best_match = os.environ.get("LAUNCHER_PROFILE")
              print(f"[Предупреждение] Точного совпадения не найдено. Используем базовый профиль: {best_match}")
          else:
              print(f"🎉 [УСПЕХ] Облако автоматически сопоставило профиль: {best_match}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"REAL_PROFILE={best_match}\n")

      - name: Run Firmware Compilation
        working-directory: openwrt-ib
        run: |
          # Полностью сносим старый кэш репозиториев Image Builder.
          # Это заставит встроенный в make image процесс принудительно перекачать индексы 
          # из интернета и гарантированно увидеть ваш custom_repo.
          rm -rf tmp/opkg-lists lists/
          
          make image             PROFILE="${{ steps.resolve_profile.outputs.REAL_PROFILE }}"             PACKAGES="${{ github.event.inputs.packages }}"             OPKG_FLAGS="-o option check_signature=0"

      - name: Upload Finished Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ steps.resolve_profile.outputs.REAL_PROFILE }}-${{ github.event.inputs.version }}
          path: openwrt-ib/bin/targets/*/*/*
