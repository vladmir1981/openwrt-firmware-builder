name: Remote Custom Image Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия OpenWrt (например, 23.05.0)'
        required: true
        default: '23.05.0'
      target:
        description: 'Архитектура (например, ramips)'
        required: true
      subtarget:
        description: 'Чипсет (например, mt7621)'
        required: true
      profile:
        description: 'Имя профиля роутера (например, xiaomi_mi-router-4a-gigabit)'
        required: true
      packages:
        description: 'Список пакетов через пробел (например, luci luci-proto-wireguard)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip libncurses5-dev zlib1g-dev libssl-dev file wget rsync

      - name: Download OpenWrt Image Builder
        run: |
          IB_URL="https://downloads.openwrt.org/releases/${{ github.event.inputs.version }}/targets/${{ github.event.inputs.target }}/${{ github.event.inputs.subtarget }}/openwrt-imagebuilder-${{ github.event.inputs.version }}-${{ github.event.inputs.target }}-${{ github.event.inputs.subtarget }}.Linux-x86_64.tar.xz"
          echo "Скачивание конструктора по адресу: $IB_URL"
          wget -O imagebuilder.tar.xz "$IB_URL"
          # Распаковываем напрямую в корень рабочей папки
          tar -xf imagebuilder.tar.xz --strip-components=1

      - name: Inject Custom Repository
        run: |
          # Файлы лежат в корне, записываем ссылку на ваш репозиторий vladmir1981 прямо вrepositories.conf
          echo "src/gz custom_repo https://vladmir1981.github.io/custom-packages-repo/" >> repositories.conf

      - name: Run Build
        run: |
          # Запускаем официальный компилятор OpenWrt из корня
          make image PROFILE="${{ github.event.inputs.profile }}" PACKAGES="${{ github.event.inputs.packages }}"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-${{ github.event.inputs.profile }}-${{ github.event.inputs.version }}
          # Указываем путь к целевой папке целиком, чтобы робот забрал файлы любого расширения (.bin, .trx, .img)
          path: bin/targets/${{ github.event.inputs.target }}/${{ github.event.inputs.subtarget }}/
